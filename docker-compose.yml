services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: lbb-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
      - BROADCAST_DRIVER=reverb
    networks:
      - lbb-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: lbb-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - lbb-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: lbb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lbb_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - lbb-db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - lbb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: lbb-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --sleep=3 --tries=1
    networks:
      - lbb-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  # Reverb WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: lbb-reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - BROADCAST_DRIVER=reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    networks:
      - lbb-network
    depends_on:
      app:
        condition: service_healthy

  # Vite Dev Server — NOW RUNS LOCALLY on the host for instant HMR.
  # Run `npm run dev` directly on your machine instead.
  # vite:
  #   image: node:20-alpine
  #   container_name: lbb-vite
  #   restart: unless-stopped
  #   working_dir: /var/www
  #   volumes:
  #     - .:/var/www
  #     - node_modules:/var/www/node_modules
  #   environment:
  #     - VITE_API_URL=http://localhost:8080
  #   command: sh -c "apk add --no-cache php php-phar php-mbstring php-openssl php-curl php-pdo php-pdo_mysql php-xml php-fileinfo php-tokenizer php-dom php-xmlwriter php-session php-iconv php-simplexml && npm run dev -- --host"
  #   ports:
  #     - "5174:5173"
  #   networks:
  #     - lbb-network
  #   depends_on:
  #     - nginx

networks:
  lbb-network:
    driver: bridge

volumes:
  lbb-db-data:
    driver: local
  nginx_cache:
    driver: local
  # node_modules volume removed — Vite runs locally now
  # node_modules:
  #   driver: local
