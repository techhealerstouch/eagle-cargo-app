services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: ec-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
      - BROADCAST_DRIVER=reverb
    networks:
      - ec-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: ec-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - ec-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ec-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eagle_cargo_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel}
    volumes:
      - ec-db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    networks:
      - ec-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: ec-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --sleep=3 --tries=1
    networks:
      - ec-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  # Reverb WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-builder
    container_name: ec-reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - BROADCAST_DRIVER=reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    networks:
      - ec-network
    depends_on:
      app:
        condition: service_healthy

networks:
  ec-network:
    driver: bridge

volumes:
  ec-db-data:
    driver: local
  nginx_cache:
    driver: local
